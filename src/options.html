<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Options</title>
		<script type="module" src="./options.ts"></script>
	</head>
	<body>
		<div id="container" style="margin: 0 auto; width: 80%;">
			<h1>Options</h1>
			<h2>Wheel Settings</h2>
			<div class="form-group" style="margin-bottom: 16px;">
				<label for="invertWheel" style="display: inline-flex; gap: 8px; align-items: center;">
					<input id="invertWheel" type="checkbox" />
					<span>Reverse wheel up/down direction</span>
				</label>
			</div>
			<h2>Automatically Allowed Sites</h2>
			<div class="form-group">
				<textarea id="domains" class="form-control" rows="5" style="width: 50vw;"></textarea>
			</div>
		</div>
	</body>
</html>
